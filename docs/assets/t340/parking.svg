   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="131.04" y="425.304" transform="rotate(-0 131.04 425.304)">Variation: one telephoto clip = 6.01 Mbps, 35.65 MB / 45 sec (47.54 MB/min), below the typical rate.</text>
  </g>
  <g id="text_36">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="131.04" y="444.312" transform="rotate(-0 131.04 444.312)">Impact-labelled groups contain mixed rates/durations; these bars are NOT an impact-event average.</text>
  </g>
  <g id="text_37">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="131.04" y="463.32" transform="rotate(-0 131.04 463.32)">Active recording consumption does not determine elapsed parked retention without event duty-cycle data.</text>
